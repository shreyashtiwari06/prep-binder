<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prep Binder</title>
<meta name="theme-color" content="#16233F">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F8; --card:#FFFFFF; --ink:#16233F; --muted:#5C6880; --line:#DCE1EA; --soft:#E9EDF4;
  --hero:#16233F; --hero-ink:#FFFFFF; --hero-muted:#A9B6D3;
  --dsa:#B86A00; --dsa-soft:#FFF1DC; --lld:#1E7A4C; --lld-soft:#E1F4EA;
  --kafka:#0A6E7A; --kafka-soft:#DDF2F4; --sql:#4A4FC2; --sql-soft:#E7E8FB; --plan:#7A3E9D; --plan-soft:#F2E9F7;
  --done:#1E7A4C; --focus:#4A4FC2; --overlay:rgba(14,22,40,.94);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1524; --card:#182136; --ink:#E8ECF5; --muted:#9AA6C0; --line:#2A3550; --soft:#1F2A42;
  --hero:#1C2A4B; --hero-ink:#FFFFFF; --hero-muted:#A9B6D3;
  --dsa:#F2B05E; --dsa-soft:#3A2A14; --lld:#6FD19B; --lld-soft:#173325; --kafka:#5ED0DB; --kafka-soft:#12333A;
  --sql:#A5A9FF; --sql-soft:#25284D; --plan:#D3A6EE; --plan-soft:#2E2140; --done:#6FD19B; --focus:#A5A9FF; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1524; --card:#182136; --ink:#E8ECF5; --muted:#9AA6C0; --line:#2A3550; --soft:#1F2A42;
  --hero:#1C2A4B; --hero-ink:#FFFFFF; --hero-muted:#A9B6D3;
  --dsa:#F2B05E; --dsa-soft:#3A2A14; --lld:#6FD19B; --lld-soft:#173325; --kafka:#5ED0DB; --kafka-soft:#12333A;
  --sql:#A5A9FF; --sql-soft:#25284D; --plan:#D3A6EE; --plan-soft:#2E2140; --done:#6FD19B; --focus:#A5A9FF; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.hero{background:var(--hero);color:var(--hero-ink);padding:28px 18px 64px}
.hero-in,.main{max-width:820px;margin:0 auto}
.hero h1{font-family:"Bricolage Grotesque","Figtree",sans-serif;font-weight:800;font-size:clamp(30px,7vw,46px);line-height:1;margin:0;letter-spacing:-.02em}
.hero p{margin:8px 0 0;color:var(--hero-muted)}
.progress{display:flex;align-items:center;gap:12px;margin-top:18px}
.bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;max-width:320px}
.bar i{display:block;height:100%;background:#7FE0A8;border-radius:99px;transition:width .4s}
.progress span{font-size:14px;color:var(--hero-muted)}
.main{padding:0 14px 72px;margin-top:-44px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.views{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px;width:max-content;margin-bottom:14px}
.views button{border:0;background:transparent;padding:7px 16px;border-radius:9px;font-weight:600;font-size:15px;cursor:pointer;color:var(--muted)}
.views button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.weekbar{display:flex;align-items:center;gap:8px}
.weekbar .nav{border:1px solid var(--line);background:var(--card);width:34px;height:34px;border-radius:10px;cursor:pointer;flex:none;font-size:18px;line-height:1}
.weekbar .nav:disabled{opacity:.35;cursor:default}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:1}
.day{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:7px 4px;cursor:pointer;text-align:center;line-height:1.15;position:relative}
.day b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:800}
.day small{font-size:12px;color:var(--muted);font-weight:600}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.day[aria-pressed="true"] small{color:inherit;opacity:.75}
.day .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--done)}
.day .today{position:absolute;left:50%;transform:translateX(-50%);bottom:-8px;font-size:10px;font-weight:700;background:var(--focus);color:#fff;border-radius:99px;padding:0 6px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 10px;gap:10px;flex-wrap:wrap}
.dayhead h2{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;margin:0;font-weight:800;letter-spacing:-.01em}
.dayhead span{color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.task{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;border-left:5px solid var(--trk)}
.task.done{opacity:.72}
.task-top{display:flex;align-items:flex-start;gap:12px}
.tag{flex:none;font-size:12px;font-weight:700;color:var(--trk);background:var(--trk-soft);border-radius:7px;padding:3px 8px;margin-top:2px}
.task h3{margin:0;font-size:17px;line-height:1.3;flex:1}
.task h3 small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.tick{flex:none;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
.tick input{appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:7px;display:grid;place-content:center;cursor:pointer;margin:0;background:var(--card)}
.tick input::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.tick input:checked{background:var(--done);border-color:var(--done)}
.tick input:checked::after{opacity:1}
.points{margin:10px 0 0;padding:0;list-style:none}
.points li{padding:5px 0 5px 22px;position:relative;font-size:15px}
.points li::before{content:"";position:absolute;left:6px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--trk)}
.points li.mystery::before{background:transparent;border:1.5px solid var(--trk)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;background:var(--trk);color:#fff}
.btn.ghost{background:var(--trk-soft);color:var(--trk)}
.vid{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--soft);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:600;flex:1 1 260px;min-width:0}
.vid .play{flex:none;width:28px;height:28px;border-radius:50%;background:#E5322D;display:grid;place-content:center}
.vid .play::after{content:"";border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}
.vid span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vid em{font-style:normal;color:var(--muted);font-weight:500;font-size:12px;display:block}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.lib h3.group{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
.lib h3.group i{width:10px;height:10px;border-radius:3px;background:var(--trk)}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.libcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.libcard .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;color:var(--trk);font-size:14px}
.libcard h4{margin:0;font-size:15px;line-height:1.35;flex:1}
.libcard .row{margin-top:2px}
.trk-DSA{--trk:var(--dsa);--trk-soft:var(--dsa-soft)}
.trk-LLD{--trk:var(--lld);--trk-soft:var(--lld-soft)}
.trk-Kafka{--trk:var(--kafka);--trk-soft:var(--kafka-soft)}
.trk-SQL{--trk:var(--sql);--trk-soft:var(--sql-soft)}
.trk-Schedule{--trk:var(--plan);--trk-soft:var(--plan-soft)}
.reader{position:fixed;inset:0;background:var(--overlay);z-index:20;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.reader.open{display:flex}
.reader-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;color:#fff}
.reader-bar strong{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reader-bar a,.reader-bar button{border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}
.pages{flex:1;overflow:auto;padding:6px 10px 30px;display:flex;flex-direction:column;align-items:center;gap:12px}
.pages canvas{max-width:100%;height:auto;background:#fff;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.pages iframe{width:100%;max-width:900px;flex:1;min-height:80vh;border:0;background:#fff;border-radius:4px}
.msg{color:#fff;opacity:.85;padding:24px;text-align:center}
@media (max-width:520px){.hero{padding:22px 16px 60px}.day b{font-size:19px}.task{padding:14px 13px 12px}.tick span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <h1>Prep binder</h1>
    <p id="sub">DSA, LLD, Kafka and SQL, one day at a time.</p>
    <div class="progress"><div class="bar"><i id="bar" style="width:0"></i></div><span id="ptext"></span></div>
  </div>
</header>
<main class="main">
  <div class="panel">
    <div class="views" role="tablist">
      <button role="tab" id="v-day" aria-selected="true">Day by day</button>
      <button role="tab" id="v-lib" aria-selected="false">All notes</button>
    </div>
    <div class="weekbar" id="weekbar">
      <button class="nav" id="prev" aria-label="Previous week">‹</button>
      <div class="days" id="days"></div>
      <button class="nav" id="next" aria-label="Next week">›</button>
    </div>
  </div>
  <div id="content"><p class="empty">Loading…</p></div>
</main>

<div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="rt">
  <div class="reader-bar"><strong id="rt"></strong><a id="rdl" download>Download</a><button id="rclose">Close</button></div>
  <div class="pages" id="pages"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  const ORDER=["DSA","LLD","Kafka","SQL"];
  const DONE_KEY="prep-binder-done";
  const $=id=>document.getElementById(id);
  const st={items:[],view:"day",sel:null,weekStart:null,done:load()};
  function load(){try{return JSON.parse(localStorage.getItem(DONE_KEY)||"{}")||{};}catch(e){return{};}}
  function save(){try{localStorage.setItem(DONE_KEY,JSON.stringify(st.done));}catch(e){}}
  const idOf=it=>(it.track+"-"+it.day).toLowerCase();
  const D=s=>new Date(s+"T00:00:00");
  const iso=d=>{const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());};
  const monday=d=>{const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x;};
  const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
  const fmt=(d,o)=>d.toLocaleDateString(undefined,o);
  const todayIso=iso(new Date());

  function weeks(){const s=new Set(st.items.filter(i=>i.date&&i.track!=="Schedule").map(i=>iso(monday(D(i.date)))));return [...s].sort();}
  function itemsOn(date){return st.items.filter(i=>i.date===date&&i.track!=="Schedule").sort((a,b)=>ORDER.indexOf(a.track)-ORDER.indexOf(b.track));}

  function progress(){
    const wk=st.weekStart; if(!wk){$("ptext").textContent="";return;}
    const end=iso(addDays(D(wk),6));
    const list=st.items.filter(i=>i.date&&i.track!=="Schedule"&&i.date>=wk&&i.date<=end);
    const n=list.filter(i=>st.done[idOf(i)]).length;
    $("bar").style.width=list.length?(n/list.length*100)+"%":"0";
    $("ptext").textContent=`${n} of ${list.length} done this week`;
    $("sub").textContent="Week of "+fmt(D(wk),{day:"numeric",month:"long"})+": DSA, LLD, Kafka and SQL, one day at a time.";
  }

  function renderWeek(){
    const ws=weeks(),days=$("days");days.textContent="";
    $("weekbar").hidden=st.view!=="day";
    if(!st.weekStart) return;
    const idx=ws.indexOf(st.weekStart);
    $("prev").disabled=idx<=0;$("next").disabled=idx<0||idx>=ws.length-1;
    for(let k=0;k<5;k++){
      const d=addDays(D(st.weekStart),k),di=iso(d),list=itemsOn(di);
      const b=document.createElement("button");b.className="day";b.setAttribute("aria-pressed",String(di===st.sel));
      const all=list.length&&list.every(i=>st.done[idOf(i)]);
      b.innerHTML=`<small>${fmt(d,{weekday:"short"})}</small><b>${d.getDate()}</b>`;
      if(all){const dot=document.createElement("i");dot.className="dot";dot.title="All done";b.appendChild(dot);}
      if(di===todayIso){const t=document.createElement("i");t.className="today";t.textContent="Today";b.appendChild(t);}
      b.setAttribute("aria-label",fmt(d,{weekday:"long",day:"numeric",month:"long"})+(all?", all done":""));
      b.onclick=()=>{st.sel=di;render();};
      days.appendChild(b);
    }
  }

  function vidLink(l){
    const a=document.createElement("a");a.className="vid";a.href=l.url;a.target="_blank";a.rel="noopener noreferrer";
    const p=document.createElement("i");p.className="play";
    const t=document.createElement("span");t.textContent=l.label||"Video";
    const em=document.createElement("em");em.textContent=/results\?search_query/.test(l.url)?"Opens YouTube search: tap the top result":"Opens the video";
    t.appendChild(em);a.append(p,t);return a;
  }
  function pdfButtons(it){
    const r=document.createElement("div");r.className="row";
    const read=document.createElement("button");read.className="btn";read.textContent="Read";read.onclick=()=>openReader(it);
    const dl=document.createElement("a");dl.className="btn ghost";dl.textContent="Download";dl.href=it.pdf;dl.setAttribute("download","");
    r.append(read,dl);return r;
  }
  function tick(it,card){
    const lab=document.createElement("label");lab.className="tick";
    const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!st.done[idOf(it)];
    cb.setAttribute("aria-label","Mark "+it.track+" as done");
    cb.onchange=()=>{if(cb.checked)st.done[idOf(it)]=true;else delete st.done[idOf(it)];save();card.classList.toggle("done",cb.checked);progress();renderWeek();};
    const s=document.createElement("span");s.textContent="Done";lab.append(s,cb);return lab;
  }
  function taskCard(it){
    const c=document.createElement("article");c.className="task trk-"+it.track+(st.done[idOf(it)]?" done":"");
    const top=document.createElement("div");top.className="task-top";
    const tag=document.createElement("span");tag.className="tag";tag.textContent=it.track+" "+it.day;
    const h=document.createElement("h3");h.textContent=it.title||"";
    top.append(tag,h,tick(it,c));c.appendChild(top);
    if(Array.isArray(it.points)&&it.points.length){
      const ul=document.createElement("ul");ul.className="points";
      it.points.forEach(p=>{const li=document.createElement("li");li.textContent=p;if(/^Mystery/i.test(p))li.className="mystery";ul.appendChild(li);});
      c.appendChild(ul);
    }
    if(it.pdf) c.appendChild(pdfButtons(it));
    const links=(it.links||[]).filter(l=>l&&/^https?:\/\//i.test(l.url||""));
    if(links.length){const r=document.createElement("div");r.className="row";links.forEach(l=>r.appendChild(vidLink(l)));c.appendChild(r);}
    return c;
  }

  function renderDay(){
    const box=$("content");box.textContent="";
    if(!st.sel){box.innerHTML='<p class="empty">No days added yet.</p>';return;}
    const d=D(st.sel),list=itemsOn(st.sel);
    const head=document.createElement("div");head.className="dayhead";
    const h=document.createElement("h2");h.textContent=fmt(d,{weekday:"long",day:"numeric",month:"long"});
    const s=document.createElement("span");s.textContent=list.length?`${list.filter(i=>st.done[idOf(i)]).length} of ${list.length} done`:"";
    head.append(h,s);box.appendChild(head);
    if(!list.length){const p=document.createElement("p");p.className="empty";p.textContent="Nothing planned for this day. Use it to catch up or revise.";box.appendChild(p);return;}
    const stack=document.createElement("div");stack.className="stack";list.forEach(it=>stack.appendChild(taskCard(it)));box.appendChild(stack);
  }

  function renderLib(){
    const box=$("content");box.textContent="";const lib=document.createElement("div");lib.className="lib";
    const groups=[["Kafka","Kafka notes"],["SQL","SQL notes"],["Schedule","Weekly plans"]];
    groups.forEach(([tr,label])=>{
      const list=st.items.filter(i=>i.track===tr&&i.pdf).sort((a,b)=>a.day-b.day);
      if(!list.length) return;
      const h=document.createElement("h3");h.className="group trk-"+tr;h.innerHTML="<i></i>";h.appendChild(document.createTextNode(label));lib.appendChild(h);
      const g=document.createElement("div");g.className="libgrid";
      list.forEach(it=>{
        const c=document.createElement("div");c.className="libcard trk-"+tr;
        const n=document.createElement("div");n.className="n";n.textContent=tr==="Schedule"?"Week "+it.day:"Day "+it.day;
        const t=document.createElement("h4");t.textContent=it.title;
        c.append(n,t,pdfButtons(it));g.appendChild(c);
      });
      lib.appendChild(g);
    });
    box.appendChild(lib);
  }

  function render(){
    $("v-day").setAttribute("aria-selected",String(st.view==="day"));$("v-lib").setAttribute("aria-selected",String(st.view==="lib"));
    if(st.sel) st.weekStart=iso(monday(D(st.sel)));
    renderWeek();progress();
    if(st.view==="day") renderDay(); else renderLib();
  }
  $("v-day").onclick=()=>{st.view="day";render();};
  $("v-lib").onclick=()=>{st.view="lib";render();};
  $("prev").onclick=()=>{const ws=weeks(),i=ws.indexOf(st.weekStart);if(i>0){st.sel=ws[i-1];render();}};
  $("next").onclick=()=>{const ws=weeks(),i=ws.indexOf(st.weekStart);if(i<ws.length-1){st.sel=ws[i+1];render();}};

  let cur=null;
  async function openReader(it){
    cur=it;$("rt").textContent=(it.track==="Schedule"?"":it.track+" Day "+it.day+": ")+(it.title||"");$("rdl").href=it.pdf;
    const pages=$("pages");pages.innerHTML='<div class="msg">Opening the PDF…</div>';
    $("reader").classList.add("open");document.body.style.overflow="hidden";$("rclose").focus();
    try{
      if(!window.pdfjsLib) throw 0;
      pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const pdf=await pdfjsLib.getDocument(it.pdf).promise;if(cur!==it)return;pages.textContent="";
      const w=Math.min(pages.clientWidth-20,900);
      for(let n=1;n<=pdf.numPages;n++){
        const pg=await pdf.getPage(n);if(cur!==it)return;
        const vp=pg.getViewport({scale:(w/pg.getViewport({scale:1}).width)*(window.devicePixelRatio||1)});
        const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;c.style.width=w+"px";pages.appendChild(c);
        await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
      }
    }catch(e){if(cur!==it)return;pages.textContent="";const f=document.createElement("iframe");f.title=it.title||"PDF";f.src=it.pdf;pages.appendChild(f);}
  }
  function closeReader(){cur=null;$("reader").classList.remove("open");$("pages").textContent="";document.body.style.overflow="";}
  $("rclose").onclick=closeReader;
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("reader").classList.contains("open"))closeReader();});

  fetch("data.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json();}).then(d=>{
    st.items=Array.isArray(d.items)?d.items:[];
    const dates=[...new Set(st.items.filter(i=>i.date&&i.track!=="Schedule").map(i=>i.date))].sort();
    st.sel=dates.includes(todayIso)?todayIso:(dates.filter(x=>x<=todayIso).pop()||dates[0]||null);
    render();
  }).catch(()=>{$("content").innerHTML='<p class="empty">The notes couldn’t be loaded. Refresh the page to try again.</p>';});
})();
</script>
</body>
</html>
