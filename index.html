<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prep Binder: Kafka & SQL notes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#1C2541; --muted:#5B6479; --line:#DDE2EC;
  --kafka:#0E7C7B; --kafka-soft:#E3F3F2; --sql:#3A5BD9; --sql-soft:#E8EDFC; --plan:#7A3E9D; --plan-soft:#F2E9F7;
  --dsa:#B4531B; --dsa-soft:#FBEDE3; --lld:#2F7D32; --lld-soft:#E7F3E7;
  --done:#2E8B57; --danger:#B3261E; --focus:#3A5BD9;
  --overlay:rgba(20,26,45,.92);
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121726; --surface:#1A2133; --ink:#E7EBF5; --muted:#A3ADC4; --line:#2C3550;
    --kafka:#3CC2BF; --kafka-soft:#163533; --sql:#8EA6FF; --sql-soft:#1E2A52; --plan:#C99BE6; --plan-soft:#2E2140;
    --dsa:#F0A06B; --dsa-soft:#3A2618; --lld:#7CCB7F; --lld-soft:#1C3320;
    --done:#5CCB8E; --danger:#FF8A80; --focus:#8EA6FF; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121726; --surface:#1A2133; --ink:#E7EBF5; --muted:#A3ADC4; --line:#2C3550;
  --kafka:#3CC2BF; --kafka-soft:#163533; --sql:#8EA6FF; --sql-soft:#1E2A52; --plan:#C99BE6; --plan-soft:#2E2140;
  --dsa:#F0A06B; --dsa-soft:#3A2618; --lld:#7CCB7F; --lld-soft:#1C3320;
  --done:#5CCB8E; --danger:#FF8A80; --focus:#8EA6FF; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 64px}
header h1{font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);max-width:60ch}
.tabs{display:flex;gap:8px;margin:24px 0 8px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:15px}
.tab[aria-selected="true"]{border-color:var(--trk);background:var(--trk-soft);color:var(--trk)}
.status{color:var(--muted);font-size:14px;margin:10px 0}
.list{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.item{display:grid;grid-template-columns:auto 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.num{font-size:44px;font-weight:800;line-height:.9;color:var(--trk);min-width:58px;letter-spacing:-.03em}
.num small{display:block;font-size:12px;font-weight:600;letter-spacing:0;color:var(--muted);margin-top:6px}
.item h2{font-size:18px;margin:0 0 2px;line-height:1.3}
.meta{font-size:13px;color:var(--muted);margin:0 0 10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--trk);background:var(--trk);color:#fff;border-radius:9px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--trk)}
.btn:disabled{opacity:.55;cursor:default}
.check{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);margin-left:4px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--done)}
.item.is-done .num{opacity:.45}
.videos{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.videos h3{font-size:13px;font-weight:700;margin:0 0 6px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.link{display:inline-flex;align-items:center;gap:6px;background:var(--trk-soft);color:var(--trk);border-radius:8px;padding:5px 10px;font-size:14px;font-weight:600;text-decoration:none;max-width:100%}
.link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
.empty-links{font-size:14px;color:var(--muted)}
.addlink{display:none;gap:6px;flex-wrap:wrap;margin-top:8px}
.addlink.open{display:flex}
.addlink input{flex:1 1 160px;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:14px}
.textbtn{border:0;background:transparent;color:var(--trk);font-weight:700;cursor:pointer;padding:4px 0;font-size:14px}
.err{color:var(--danger);font-size:13px;margin-top:6px}
.trk-Kafka{--trk:var(--kafka);--trk-soft:var(--kafka-soft)}
.trk-SQL{--trk:var(--sql);--trk-soft:var(--sql-soft)}
.trk-Schedule{--trk:var(--plan);--trk-soft:var(--plan-soft)}
.trk-DSA{--trk:var(--dsa);--trk-soft:var(--dsa-soft)}
.trk-LLD{--trk:var(--lld);--trk-soft:var(--lld-soft)}
.points{margin:4px 0 10px;padding-left:20px}
.points li{margin:2px 0}
.trk-All{--trk:var(--ink);--trk-soft:var(--line)}
details.admin{margin-top:36px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
details.admin summary{cursor:pointer;font-weight:700}
.form{display:grid;gap:10px;margin-top:12px}
.form label{display:grid;gap:4px;font-size:14px;font-weight:600}
.form input,.form select{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* reader */
.reader{position:fixed;inset:0;background:var(--overlay);z-index:20;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.reader.open{display:flex}
.reader-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff}
.reader-bar strong{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reader-bar button{border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:9px;padding:6px 12px;font-weight:700;cursor:pointer}
.pages{flex:1;overflow:auto;padding:6px 10px 30px;display:flex;flex-direction:column;align-items:center;gap:12px}
.pages canvas{max-width:100%;height:auto;background:#fff;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.pages iframe{width:100%;max-width:900px;flex:1;min-height:80vh;border:0;background:#fff;border-radius:4px}
.reader-msg{color:#fff;opacity:.85;padding:20px;text-align:center}
@media (max-width:520px){.item{grid-template-columns:1fr;gap:6px}.num{font-size:34px}.num small{display:inline;margin-left:8px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

a.btn{text-decoration:none;display:inline-block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Prep binder</h1>
    <p>Our whole prep day in one place: DSA problems and LLD topics with their videos, plus the Kafka and SQL notes. Open the videos, read or download the PDFs, and tick each day off when you’re done.</p>
  </header>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="status" id="status" role="status">Loading notes…</div>
  <div class="list" id="list"></div>
</div>

<div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="reader-title">
  <div class="reader-bar">
    <strong id="reader-title"></strong>
    <a id="reader-dl" class="btn" style="border-color:rgba(255,255,255,.6);background:transparent;color:#fff" download>Download</a>
    <button id="reader-close">Close</button>
  </div>
  <div class="pages" id="pages"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  const LABEL={DSA:"DSA",LLD:"LLD",Kafka:"Kafka",SQL:"SQL",Schedule:"Schedules"};
  const TABS=[["dsa","DSA"],["lld","LLD"],["kafka","Kafka"],["sql","SQL"],["schedules","Schedules"]];
  const KEY="prep-binder-done";
  const state={items:[],tab:readTab(),done:loadDone(),loaded:false};
  const $=id=>document.getElementById(id);
  function loadDone(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){return {};}}
  function saveDone(){try{localStorage.setItem(KEY,JSON.stringify(state.done));}catch(e){}}
  function readTab(){const h=(location.hash||"").slice(1);return TABS.some(t=>t[0]===h)?h:"dsa";}
  function tabTrack(t){const f=TABS.find(x=>x[0]===t);return f?(f[0]==="schedules"?"Schedule":f[1]):"DSA";}
  function idOf(it){return (it.track+"-"+it.day).toLowerCase();}
  window.addEventListener("hashchange",()=>{state.tab=readTab();render();});

  function renderTabs(){
    const tabs=$("tabs");tabs.textContent="";
    TABS.forEach(([key,label])=>{
      const b=document.createElement("button");
      b.className="tab trk-"+tabTrack(key);b.setAttribute("role","tab");
      b.setAttribute("aria-selected",String(state.tab===key));
      const count=state.items.filter(i=>i.track===tabTrack(key)).length;
      b.textContent=count?`${label} (${count})`:label;
      b.onclick=()=>{location.hash=key;};
      tabs.appendChild(b);
    });
  }
  function fmtDate(s){try{return new Date(s+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});}catch(e){return "";}}
  function render(){
    renderTabs();
    const list=$("list");list.textContent="";
    if(!state.loaded) return;
    const track=tabTrack(state.tab);
    const items=state.items.filter(i=>i.track===track).sort((a,b)=>(a.day||0)-(b.day||0));
    if(!items.length){const p=document.createElement("p");p.className="status";p.textContent=`No ${LABEL[track]} notes yet.`;list.appendChild(p);return;}
    items.forEach(it=>list.appendChild(card(it)));
  }
  function card(it){
    const id=idOf(it);
    const el=document.createElement("article");
    el.className="item trk-"+it.track+(state.done[id]?" is-done":"");
    const num=document.createElement("div");num.className="num";
    num.textContent=it.track==="Schedule"?"W"+(it.day||""):String(it.day||"");
    const sm=document.createElement("small");sm.textContent=it.track==="Schedule"?"week":"day";num.appendChild(sm);
    const body=document.createElement("div");
    const h=document.createElement("h2");h.textContent=it.title||"Untitled";
    const meta=document.createElement("p");meta.className="meta";meta.textContent=it.when?it.when:(it.added?("Added "+fmtDate(it.added)):"");
    let pts=null;
    if(Array.isArray(it.points)&&it.points.length){pts=document.createElement("ul");pts.className="points";it.points.forEach(p=>{if(typeof p==="string"){const li=document.createElement("li");li.textContent=p;pts.appendChild(li);}});}
    const act=document.createElement("div");act.className="actions";
    if(it.pdf){
      const r=document.createElement("button");r.className="btn";r.textContent="Read";r.onclick=()=>openReader(it);
      const d=document.createElement("a");d.className="btn ghost";d.textContent="Download";d.href=it.pdf;d.setAttribute("download","");
      act.append(r,d);
    }
    const lab=document.createElement("label");lab.className="check";
    const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!state.done[id];
    cb.onchange=()=>{if(cb.checked)state.done[id]=true;else delete state.done[id];saveDone();render();};
    lab.append(cb,document.createTextNode("Done"));act.appendChild(lab);
    body.append(h,meta);if(pts)body.appendChild(pts);body.append(act,videos(it));
    el.append(num,body);return el;
  }
  function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return "Video";}}
  function videos(it){
    const box=document.createElement("div");box.className="videos";
    const h=document.createElement("h3");h.textContent="Videos";box.appendChild(h);
    const wrap=document.createElement("div");wrap.className="links";
    const links=(Array.isArray(it.links)?it.links:[]).filter(l=>l&&typeof l.url==="string"&&/^https?:\/\//i.test(l.url));
    if(!links.length){const s=document.createElement("span");s.className="empty-links";s.textContent="No videos saved for this day yet.";wrap.appendChild(s);}
    links.forEach(l=>{
      const a=document.createElement("a");a.className="link";a.href=l.url;a.target="_blank";a.rel="noopener noreferrer";
      const sp=document.createElement("span");sp.textContent="▶ "+(l.label||hostOf(l.url));a.appendChild(sp);wrap.appendChild(a);
    });
    box.appendChild(wrap);return box;
  }
  let current=null;
  async function openReader(it){
    current=it;
    $("reader-title").textContent=(it.track==="Schedule"?"":it.track+" Day "+it.day+": ")+(it.title||"");
    $("reader-dl").href=it.pdf;
    const pages=$("pages");pages.textContent="";
    const msg=document.createElement("div");msg.className="reader-msg";msg.textContent="Opening the PDF…";pages.appendChild(msg);
    $("reader").classList.add("open");document.body.style.overflow="hidden";$("reader-close").focus();
    try{
      if(!window.pdfjsLib) throw new Error("no pdfjs");
      pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const pdf=await pdfjsLib.getDocument(it.pdf).promise;
      if(current!==it) return;
      pages.textContent="";
      const width=Math.min(pages.clientWidth-20,900);
      for(let n=1;n<=pdf.numPages;n++){
        const page=await pdf.getPage(n); if(current!==it) return;
        const base=page.getViewport({scale:1});
        const vp=page.getViewport({scale:(width/base.width)*(window.devicePixelRatio||1)});
        const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;c.style.width=width+"px";
        pages.appendChild(c);
        await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
      }
    }catch(e){
      if(current!==it) return;
      pages.textContent="";
      const f=document.createElement("iframe");f.title=it.title||"PDF";f.src=it.pdf;pages.appendChild(f);
    }
  }
  function closeReader(){current=null;$("reader").classList.remove("open");$("pages").textContent="";document.body.style.overflow="";}
  $("reader-close").onclick=closeReader;
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("reader").classList.contains("open"))closeReader();});

  render();
  fetch("data.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json();}).then(d=>{
    state.items=Array.isArray(d.items)?d.items:[];state.loaded=true;$("status").textContent="";render();
  }).catch(()=>{state.loaded=true;$("status").textContent="The notes list couldn’t be loaded. Refresh the page to try again.";render();});
})();
</script>
</body>
</html>
